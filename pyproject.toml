[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prado-os"
version = "0.1.0"
description = "Autonomous, cross-platform academic workflow engine for Moodle and PRADO UGR"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Lorenzo Vasile", email = "lorenzovasile07@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Education",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "keyring>=24.0.0",
    "pyyaml>=6.0",
    "cryptography>=41.0.0",
    "urllib3>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
prado = "prado.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prado"]
